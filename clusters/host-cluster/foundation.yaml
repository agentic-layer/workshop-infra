---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-operators
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/operators
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-monitoring-controllers
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/monitoring-controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-monitoring
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: foundation-monitoring-controllers
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-apps
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: foundation-operators
