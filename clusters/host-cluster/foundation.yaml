---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-controllers
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/observability-controllers
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: observability-controllers
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-operators
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/platform-operators
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-gateways
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/platform-gateways
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-operators
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-serving-plane
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/user-serving-plane
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-gateways
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quality-plane
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./foundation/host-cluster/quality-plane
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-gateways
