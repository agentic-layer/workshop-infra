apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  type: oci
  url: oci://cr.agentgateway.dev/charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: agentgateway-system
spec:
  chart:
    spec:
      chart: agentgateway-crds
      sourceRef:
        kind: HelmRepository
        name: agentgateway
        namespace: agentgateway-system
      version: "v1.1.0"
  interval: 1h
  releaseName: agentgateway-crds
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  dependsOn:
    - name: agentgateway-crds
  chart:
    spec:
      chart: agentgateway
      sourceRef:
        kind: HelmRepository
        name: agentgateway
        namespace: agentgateway-system
      version: "v1.1.0"
  interval: 1h
  releaseName: agentgateway
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tool-gateway-agentgateway
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/agentic-layer/manifests/tool-gateway-agentgateway
  ref:
    tag: "0.3.0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tool-gateway-agentgateway
  namespace: flux-system
spec:
  sourceRef:
    kind: OCIRepository
    name: tool-gateway-agentgateway
  interval: 10m
  path: ./
  prune: true
  wait: true
  dependsOn:
    - name: agent-runtime-operator
