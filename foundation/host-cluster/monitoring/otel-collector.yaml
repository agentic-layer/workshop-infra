apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: monitoring
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.151.0
  resources:
    requests:
      cpu: 10m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi
  podDisruptionBudget:
    minAvailable: 1
  targetAllocator:
    enabled: true
    serviceAccount: otel-targetallocator
    prometheusCR:
      enabled: true
      podMonitorSelector: {}
      serviceMonitorSelector: {}
    allocationStrategy: per-node
  env:
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  config:
    receivers:
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        extra_metadata_labels:
          - k8s.volume.type
        metric_groups:
          - container
          - pod
          - volume
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']
    processors:
      batch:
        timeout: 10s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform/kubeletstats_labels:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["k8s.pod.name"], resource.attributes["k8s.pod.name"])
              - set(attributes["k8s.namespace.name"], resource.attributes["k8s.namespace.name"])
              - set(attributes["k8s.node.name"], resource.attributes["k8s.node.name"])
              - set(attributes["k8s.container.name"], resource.attributes["k8s.container.name"])
              - set(attributes["k8s.volume.name"], resource.attributes["k8s.volume.name"])
              - set(attributes["k8s.volume.type"], resource.attributes["k8s.volume.type"])
              - set(attributes["k8s.persistentvolumeclaim.name"], resource.attributes["k8s.persistentvolumeclaim.name"])
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
          labels: []
          annotations: []
    exporters:
      otlp_grpc/tempo:
        endpoint: "tempo.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      otlp_http/observability:
        endpoint: "http://observability-dashboard.observability-dashboard.svc.cluster.local:8000"
        tls:
          insecure: true
      otlp_http/mimir:
        endpoint: "http://mimir-gateway.monitoring.svc.cluster.local/otlp"
        tls:
          insecure: true
      otlp_http/loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp_grpc/tempo, otlp_http/observability]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp_http/mimir]
        metrics/kubeletstats:
          receivers: [kubeletstats]
          processors: [memory_limiter, transform/kubeletstats_labels, batch]
          exporters: [otlp_http/mimir]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp_http/loki]
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://mimir-gateway.monitoring.svc.cluster.local/otlp/v1/metrics
