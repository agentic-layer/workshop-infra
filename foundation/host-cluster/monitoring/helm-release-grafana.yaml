apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      version: "10.5.15"
  interval: 1h0m0s
  releaseName: grafana
  values:
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Editor
      unified_alerting:
        enabled: true

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki.monitoring.svc.cluster.local:3100
            isDefault: false
            jsonData:
              maxLines: 1000

          - name: Mimir
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
            isDefault: false
            jsonData:
              timeInterval: 30s

          - name: Tempo
            type: tempo
            access: proxy
            url: http://tempo.monitoring.svc.cluster.local:3200
            isDefault: true
            jsonData:
              tracesToLogsV2:
                datasourceUid: Loki
                spanStartTimeShift: -1h
                spanEndTimeShift: 1h
                filterByTraceID: true
                filterBySpanID: false
              tracesToMetrics:
                datasourceUid: Mimir
              serviceMap:
                datasourceUid: Mimir
              nodeGraph:
                enabled: true
              lokiSearch:
                datasourceUid: Loki

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL

    service:
      type: ClusterIP
      port: 80

    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
