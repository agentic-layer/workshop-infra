apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: testbench-operator
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/agentic-layer/testbench/manifests/testbench-operator
  ref:
    tag: "0.8.2"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: testbench-operator
  namespace: flux-system
spec:
  sourceRef:
    kind: OCIRepository
    name: testbench-operator
  interval: 10m
  path: ./default
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure
