apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: testbench-operator
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/agentic-layer/testbench/manifests/testbench-operator
  ref:
    tag: "0.9.1"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: testbench-operator
  namespace: flux-system
spec:
  sourceRef:
    kind: OCIRepository
    name: testbench-operator
  interval: 10m
  path: ./default
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure
    - name: foundation-monitoring-controllers
  images:
    - name: ghcr.io/agentic-layer/testbench/testworkflows
      newTag: "0.9.1"
  patches:
    - target:
        kind: TestWorkflowTemplate
        name: publish-template
      patch: |
        - op: add
          path: /spec/steps/0/run/env
          value:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring:4318
