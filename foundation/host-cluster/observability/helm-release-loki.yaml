apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  chart:
    spec:
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      version: "7.0.0"
  interval: 1h0m0s
  releaseName: loki
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            object_store: filesystem
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 10Gi
      resources:
        requests:
          cpu: 10m
          memory: 400Mi
        limits:
          cpu: 1
          memory: 2Gi

    lokiCanary:
      resources:
        requests:
          cpu: 10m
          memory: 25Mi
        limits:
          cpu: 100m
          memory: 50Mi

    resultsCache:
      resources:
        requests:
          cpu: 10m
          memory: 25Mi
        limits:
          cpu: 500m
          memory: 100Mi

    chunksCache:
      resources:
        requests:
          cpu: 10m
          memory: 25Mi
        limits:
          cpu: 500m
          memory: 100Mi

    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
