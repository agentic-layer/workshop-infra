apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - serviceaccount.yaml
  - rbac.yaml
patches:
  - target:
      kind: Namespace
      name: ns-.*
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          instrumentation.opentelemetry.io/inject-sdk: monitoring/otel-instrumentation
